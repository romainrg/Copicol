name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.yml"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Unit tests
        run: |
          xcodegen generate
          xcodebuild test -project Copicol.xcodeproj -scheme Copicol -derivedDataPath build -destination 'platform=macOS'

      - name: Universal Release build
        run: scripts/build-release.sh

      - name: Release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > build/release/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/release/Copicol-$version.zip" \
            "build/release/Copicol-$version.zip.sha256" \
            --title "Copicol $version" \
            --notes-file build/release/notes.md \
            --verify-tag
